name: CI Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-quality-gate:
    name: Backend (NestJS / apps/api)
    runs-on: ubuntu-latest

    env:
      CI: true
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/postgres?schema=public"
      CORS_ORIGIN: "http://localhost:3000"
      JWT_ACCESS_SECRET: "ci-dummy-jwt-access-secret-minimum-32-chars-long"
      JWT_REFRESH_SECRET: "ci-dummy-jwt-refresh-secret-minimum-32-chars-long"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma Schema
        run: pnpm --filter api run prisma:validate

      - name: Generate Prisma Client
        run: pnpm --filter api run prisma:generate

      - name: Run ESLint (Clean Code & Style Rules)
        run: pnpm --filter api run lint:check

      - name: Build Backend (TypeScript Strict Mode)
        run: pnpm --filter api run build

      - name: Run Unit Tests
        run: pnpm --filter api run test

  web-quality-gate:
    name: Frontend (Next.js / apps/web)
    runs-on: ubuntu-latest

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:3000/api/v1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter web run lint

      - name: Strict TypeScript Typecheck
        run: pnpm --filter web run typecheck

      - name: Run Vitest Suite (with Coverage)
        run: pnpm --filter web run test:coverage

      - name: Build Frontend (Production Optimization)
        run: pnpm --filter web run build
